# cargo-about (plan-history.md 3.6): the release workflow builds THIRD-PARTY-NOTICES.html from
# this and about.hbs, and fails if a dependency's licence isn't accepted here.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
# Only what ships in the Windows exe.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
