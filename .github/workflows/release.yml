# Release (plan-history.md 3.6): a signed sqlh.exe, its SHA-256 and a zip with the licence and
# the third-party notices, published as a draft GitHub release for the owner to review and
# publish.
#
#   push a tag v<x.y.z>   a release build; the tag must match Cargo.toml's version
#   run it by hand        a pre-release build, v<x.y.z>-dev.<run number>
#
# Four jobs, so that no code from the build (dependencies, build scripts, the exe itself) runs
# where the signing identity or write access can be reached (R22):
#   build    read-only; builds and checks, runs the unsigned exe, uploads it with the notices,
#            and uploads the tests' binary for AppVeyor's certification run (decision 75)
#   sign     the only job that can request the Azure token; signs, verifies the signature and
#            packages the exe as data, never running it
#   verify   read-only; runs the signed exe and checks the sums
#   publish  writes the draft release; no Azure access, and runs nothing it downloads
# sign, verify and publish run only in the owner's repository for a tag or main. The owner is
# checked by immutable id, so the gate survives an account rename.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # SQLH_VERSION is what `sqlh --version` reports (DESIGN.md §4); tests read it too.
    # SQLH_BUILD, the run number, is the fourth number of the exe's Windows file version
    # (build.rs, decision 44), so a release built after its pre-releases is newer than them.
    # Context values reach scripts through env, never pasted into the script text.
    - name: Version
      id: version
      shell: pwsh
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        $cargo = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages |
          Where-Object name -eq 'sqlh' | Select-Object -ExpandProperty version
        if ($env:REF_TYPE -eq 'tag') {
          if ($env:REF_NAME -cne "v$cargo") {
            throw "tag $env:REF_NAME doesn't match Cargo.toml's version $cargo"
          }
          $version = $cargo
          $prerelease = 'false'
        } else {
          $version = "$cargo-dev.$env:RUN_NUMBER"
          $prerelease = 'true'
        }
        "SQLH_VERSION=$version" >> $env:GITHUB_ENV
        "SQLH_BUILD=$env:RUN_NUMBER" >> $env:GITHUB_ENV
        "version=$version" >> $env:GITHUB_OUTPUT
        "build=$env:RUN_NUMBER" >> $env:GITHUB_OUTPUT
        "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
        "sqlh $version (pre-release: $prerelease)"

    - name: Check
      shell: pwsh
      run: pwsh -NoProfile -File scripts/check.ps1

    # The exe reports this version; checked here, where running it can reach nothing.
    - name: Version check
      shell: pwsh
      run: |
        $reported = & target/release/sqlh.exe --version
        if ($reported -notmatch "^sqlh $([regex]::Escape($env:SQLH_VERSION)) ") {
          throw "the exe reports '$reported', not $env:SQLH_VERSION"
        }

    # The process and live tests' binary, built by Check alongside the exe with the same
    # version, for a release certification run on AppVeyor against the signed exe (decision
    # 75, scripts/appveyor-live.ps1). A workflow artifact, never a release asset. --no-run
    # builds nothing here; it names the file Check built.
    - name: Stage tests
      shell: pwsh
      run: |
        $bin = @(cargo test --locked --release --test cli --no-run --message-format=json |
          ForEach-Object { $_ | ConvertFrom-Json } |
          Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'cli' -and $_.executable } |
          ForEach-Object executable)
        if ($bin.Count -ne 1) { throw "expected one test binary, found: $($bin -join ', ')" }
        New-Item -ItemType Directory -Force tests-bin | Out-Null
        Copy-Item $bin[0] tests-bin/sqlh-live-tests.exe

    - name: Upload tests
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: sqlh-live-tests
        path: tests-bin/
        if-no-files-found: error
        retention-days: 30

    - name: Third-party notices
      shell: pwsh
      run: |
        cargo install cargo-about --version 0.9.2 --locked --features cli
        cargo about generate --locked --fail about.hbs -o THIRD-PARTY-NOTICES.html

    # One flat folder, so the sign job finds build/sqlh.exe (an artifact of several paths
    # keeps their layout).
    - name: Stage
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force unsigned | Out-Null
        Copy-Item target/release/sqlh.exe, THIRD-PARTY-NOTICES.html unsigned/

    - name: Upload unsigned
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: unsigned
        path: unsigned/
        if-no-files-found: error

  sign:
    needs: build
    if: github.repository_owner_id == '6507651' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    runs-on: windows-latest
    # Signing is restricted to this repository's release environment and the owner-id gate
    # above. The environment limits eligible refs to main and version tags.
    environment: release
    permissions:
      contents: read
      id-token: write # the federated credential for Azure Artifact Signing
    env:
      SQLH_VERSION: ${{ needs.build.outputs.version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Download unsigned
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: unsigned
        path: build

    - name: Azure login
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Install sign
      run: dotnet tool install --global sign --prerelease

    - name: Sign
      shell: pwsh
      run: |
        sign code artifact-signing build/sqlh.exe `
          --artifact-signing-account tkwj `
          --artifact-signing-certificate-profile tkwj-github `
          --artifact-signing-endpoint https://eus.codesigning.azure.net `
          --verbosity information
        if ($LASTEXITCODE) { exit $LASTEXITCODE }

    # signtool reads the exe as data; nothing here runs it (R22).
    - name: Verify signature
      shell: pwsh
      run: |
        $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object FullName -Descending | Select-Object -First 1
        & $signtool.FullName verify /pa /v build/sqlh.exe
        if ($LASTEXITCODE) { exit $LASTEXITCODE }

    - name: Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force dist | Out-Null
        Copy-Item build/sqlh.exe dist/
        $zip = "dist/sqlh-$env:SQLH_VERSION-windows-x64.zip"
        Compress-Archive -Path dist/sqlh.exe, LICENSE, build/THIRD-PARTY-NOTICES.html -DestinationPath $zip
        Get-ChildItem dist -File | ForEach-Object {
          "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
        } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
        Get-Content dist/SHA256SUMS.txt

    - name: Upload signed
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: sqlh-${{ env.SQLH_VERSION }}
        path: dist/
        if-no-files-found: error

  verify:
    needs: [build, sign]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      SQLH_VERSION: ${{ needs.build.outputs.version }}
      SQLH_BUILD: ${{ needs.build.outputs.build }}

    steps:
    - name: Download signed
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: sqlh-${{ env.SQLH_VERSION }}
        path: dist

    # The signed exe still verifies, matches its sums, runs, and reports this version, in
    # --version and in its Windows file properties.
    - name: Verify
      shell: pwsh
      run: |
        $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object FullName -Descending | Select-Object -First 1
        & $signtool.FullName verify /pa dist/sqlh.exe
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        foreach ($line in Get-Content dist/SHA256SUMS.txt) {
          $hash, $name = $line -split '  ', 2
          $actual = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $hash) { throw "$name doesn't match SHA256SUMS.txt" }
        }
        $reported = & dist/sqlh.exe --version
        if ($reported -notmatch "^sqlh $([regex]::Escape($env:SQLH_VERSION)) ") {
          throw "the signed exe reports '$reported', not $env:SQLH_VERSION"
        }
        $info = (Get-Item dist/sqlh.exe).VersionInfo
        $numbers = '{0}.{1}.{2}.{3}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart
        $expected = ($env:SQLH_VERSION -split '-', 2)[0] + ".$env:SQLH_BUILD"
        if ($info.ProductVersion -cne $env:SQLH_VERSION -or $numbers -ne $expected) {
          throw "the signed exe's properties say $($info.ProductVersion) ($numbers), not $env:SQLH_VERSION ($expected)"
        }

  publish:
    needs: [build, verify]
    runs-on: windows-latest
    permissions:
      contents: write # the draft release
    env:
      SQLH_VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}

    steps:
    - name: Download signed
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: sqlh-${{ env.SQLH_VERSION }}
        path: dist

    # A draft: nothing is public until the owner reviews and publishes it.
    - name: Draft release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        $flags = @('--draft', '--generate-notes', '--title', "sqlh $env:SQLH_VERSION")
        if ($env:PRERELEASE -eq 'true') { $flags += @('--prerelease', '--target', $env:SHA) }
        gh release create "v$env:SQLH_VERSION" @flags (Get-ChildItem dist -File).FullName
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
