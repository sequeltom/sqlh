# CI (plan-history.md 3.5): every push to main and every pull request runs the same checks
# as scripts/check.ps1 locally, so the two can't drift. No live tests (there is no server
# here) and no secrets, so forks and pull requests can run it.
name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    # A run takes about 15 minutes. A test process that hangs is killed by the tests' own
    # watchdog (tests/cli.rs, `finish`, R43); this bounds anything else, which would
    # otherwise run to GitHub's 6-hour default.
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # The toolchain, components and target come from rust-toolchain.toml; rustup installs
    # them on the first cargo call.
    - name: Toolchain
      run: rustup show

    - name: Check
      run: pwsh -NoProfile -File scripts/check.ps1
      shell: pwsh
