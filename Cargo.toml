[package]
name = "sqlh"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "SQL Server query tool for AI agents and harnesses"
license = "MIT"
repository = "https://github.com/sequeltom/sqlh"
publish = false

[dependencies]
# JSON-RPC for sqlh mcp (docs/mcp-mode.md §8): Value and json! only, no derive; 65 KB of the exe (spike 5.1).
serde_json = "1"
# Preview driver: pin exactly and read the changelog before bumping. Only src/db/ may use it.
mssql-tds = "=0.3.0"
# mssql-tds already pulls tokio with "full"; we name only what we use.
tokio = { version = "1", default-features = false, features = ["rt", "time", "signal", "macros", "sync"] }
lexopt = "0.3"
# Wipes sqlh's own copies of a password when they are dropped (F14, src/secret.rs). Already
# in the tree through mssql-tds, so it costs no build time and next to no size.
zeroize = "1"
# Feature `timing` only. Already in the tree through mssql-tds's tracing.
log = { version = "0.4", optional = true }

[features]
# Developer builds (plan-history.md 2.1): --verbose and `profile test` also time each connect
# step (tcp, prelogin, tls, login) from the driver's log events. Off by default: listening to
# the driver's logging keeps all of its log formatting in the exe (+270 KB, about 12%).
timing = ["dep:log"]

[target.'cfg(windows)'.dependencies]
# Same version mssql-tds already uses; we add the console API (password prompt) and
# file identity (refusing -o onto an input file).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# serde_json is built for size (owner, 2026-10-18, decision 20 amended, PLAN.md §6): it saves
# about 9.5 KiB of the exe, and its speed doesn't matter at MCP's message sizes.
[profile.release.package.serde_json]
opt-level = "z"

[dev-dependencies]
# The tests parse --format json output with it to check it is well-formed. It is also a normal
# dependency since sqlh mcp (above), so this entry is redundant; a dev-dependency never reaches
# the exe.
serde_json = "1"
